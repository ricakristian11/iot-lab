# /etc/mosquitto/conf.d/apartment.conf
# Mosquitto 2.x refuses remote clients until a listener and an auth method are set explicitly.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
# The passwd file itself is NOT in this repo. Create it on the Pi with:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd hubuser
#   sudo mosquitto_passwd /etc/mosquitto/passwd esp32node
#   sudo mosquitto_passwd /etc/mosquitto/passwd nodered
